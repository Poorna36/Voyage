# =============================================================================
# configs/quantum.yaml
# Chandrayaan-2 Lunar Image Registration — Unified Quantum Configuration (Build Spec v2 §5)
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Unified Spec v2 Quantum Configuration Schema (§5)
# ─────────────────────────────────────────────────────────────────────────────
quantum:
  enabled: false               # Master switch: when false, entire pipeline is pure classical
  mode: "classical"            # 'classical' | 'hybrid' | 'experimental'

  matcher_selector:
    enabled: true
    strategy: "rules"          # 'rules' | 'learned'
    model_path: "models/msm_v1.pkl"
    fallback_matcher: "sift"

  qnn_reliability:
    enabled: false
    model_path: "models/qnn_reliability.pkl"
    backend: "aer_simulator"   # Local simulator only
    threshold: 0.5

  qcnn_features:
    enabled: false
    patch_size: 4              # 4x4 or 8x8
    qubits: 4                  # 4 to 8
    descriptor_dim: 4

  simulator:
    backend: "qiskit_aer"      # 'qiskit_aer'
    mode: "ideal_simulator"    # 'ideal_simulator' | 'noisy_simulator' | 'fake_ibm_backend'
    fake_backend_name: "fake_ibm_perth"
    noise_model:
      depolarizing_error: 0.001
      readout_error: 0.015
    shots: 1024

  qaoa_correspondence:
    enabled: false
    depth_p: 1
    max_variables: 16
    optimizer: "COBYLA"
    use_exact_benchmark: true  # Compute gap to exact for M <= 16

# ─────────────────────────────────────────────────────────────────────────────
# Operational Settings & Legacy Module Registry (Preserved for Q0-Q7)
# ─────────────────────────────────────────────────────────────────────────────
enabled: true
global_mode: "shadow"   # "off" | "shadow" | "active"
seed: 42

limits:
  max_qubits: 16               # statevector simulation limit
  max_runtime_s: 60.0          # per module wall-clock limit
  max_problem_variables: 64    # max vars before SQA/split fallback

default_backend: "numpy_statevector"

modules:
  Q0_filter:
    name: "QUBO Correspondence Filter"
    mode: "shadow"
    solver: "sqa"
    max_candidates: 48
    unary_weight: 1.0
    pairwise_weight: 1.0
    lambda_penalty: 5.0
    dynamic_lambda: true
    sqa_sweeps: 500
    sqa_reads: 5

  Q1_selection:
    name: "QAOA Keypoint-Subset Selection"
    mode: "shadow"
    grid_n: 8
    cap_per_cell: 5
    max_qubits_per_cell: 12
    p_layers: 2
    restarts: 5
    redundancy_mu: 1.5
    sigma_fraction: 0.333333
    shots: 1024

  Q2_router:
    name: "Quantum Kernel Matcher Router"
    mode: "shadow"
    qubits: 8
    reps: 2
    c_reg: 1.0
    subsample_max: 1000

  Q2_inlier:
    name: "Quantum Kernel Inlier Scorer"
    mode: "shadow"
    qubits: 8
    reps: 2
    c_reg: 1.0
    subsample_max: 1000

  Q3_consensus:
    name: "Grover Consensus Hypotheses Search"
    mode: "shadow"
    max_candidate_matches: 16
    subset_size: 4
    inlier_threshold_px: 3.0
    min_inlier_ratio: 0.50
    shots: 1024

  Q4_phase_corr:
    name: "QFT Phase Correlation"
    mode: "shadow"
    tile_size: 32
    hann_window: true
    zero_pad: true
    subpixel_paraboloid: true

  Q5_encoding:
    name: "Quantum Image Encoding & Edge Detection"
    mode: "shadow"
    tile_size: 16
    encoding_type: "frqi"
    edge_detection: true

  Q7_signing:
    name: "Post-Quantum Cryptographic Signatures"
    mode: "active"
    algorithm: "ML-DSA-65+Ed25519"
    pubkey_id: "voyage-2026-01"
    private_key_env: "VOYAGE_PQC_PRIVATE_KEY"
    sign_extensions: [".tif", ".csv", ".json", ".png"]

backends:
  numpy_statevector:
    kind: "simulator"
    max_qubits: 16
  qiskit_aer:
    kind: "simulator"
    max_qubits: 24
  dwave_neal:
    kind: "annealer"
    max_qubits: 2048
  ibm_runtime:
    kind: "hardware"
    max_qubits: 127
  dwave_leap:
    kind: "hardware"
    max_qubits: 5000
