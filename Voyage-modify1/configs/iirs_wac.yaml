# =============================================================================
# configs/iirs_wac.yaml
# IIRS (Chandrayaan-2 hyperspectral, 80 m/px) vs LRO WAC 643nm pipeline.
# Inherits defaults from configs/default.yaml.
#
# CRITICAL: This module is COMPLETELY SEPARATE from the panchromatic pipeline.
# It must NEVER be invoked by ohrc_nac or tmc_wac configs.
# Has its own results directory and leaderboard rows labeled "IIRS-WAC".
# Accuracy target: RMSE < 80 m absolute (sub-pixel at 80 m GSD).
#
# Per ARCHITECTURE.md §5 and FEATURES.md F24.
# =============================================================================

extends: default
sensor_pair: IIRS-WAC
separate_module: true               # NEVER invoked by ohrc_nac / tmc_wac pipeline

# ---------------------------------------------------------------------------
# L0 — Data and Geometry
# ---------------------------------------------------------------------------
asp:
  version_min: "3.7.0"
  env: conda
  isisdata: $ISISDATA

pair:
  src_sensor: IIRS
  src_format: qub                    # IIRS uses QUB format (not PDS4 img+xml)
  ref_type: WAC
  src_gsd_m: 80.0                    # IIRS spatial resolution
  ref_gsd_m: 100.0                   # WAC 643nm mosaic
  src_bands: 250                     # IIRS spectral bands (0.8–5.0 µm)
  k_pointing: 3
  sigma_pointing_m: 2000
  overlap_fraction_min: 0.5
  geo_cell_deg: 10
  wac_reference: data/reference/wac_643nm.tif
  reference_fallback_chain:
    - wac_crop
  selene_status: future_compatible

# ---------------------------------------------------------------------------
# IIRS-specific: Photometric Correction (MANDATORY before any feature op)
# Per ARCHITECTURE.md §5 step 1 and FEATURES.md F24.
# ---------------------------------------------------------------------------
iirs:
  photometric_correction: true       # MANDATORY — must run BEFORE any feature operation
  correction_model: hapke            # Hapke model (TUNE — verify against IIRS calibration report)
  registration_band: auto            # auto = brightest band nearest to WAC 643nm (0.643 µm)
  wac_reference_wavelength_um: 0.643
  accuracy_target_m: 80              # sub-pixel at 80m GSD = sub-80m absolute RMSE
  results_label: "IIRS-WAC"         # label for all leaderboard rows

# ---------------------------------------------------------------------------
# L1 — Preprocessing
# IIRS uses minimal preprocessing only (no panchromatic branches)
# ---------------------------------------------------------------------------
preprocessing:
  shadow_mask:
    incidence_threshold_deg: 80
    local_variance_window: 15
    flat_variance_threshold: 10
    mask_min_pct: 5
    mask_max_pct: 30

  radiometric_norm:
    percentile_clip: [2, 98]
    stat_transfer: true

  sensor_branch: minimal             # no heavy CLAHE/PCA for IIRS
  gsd:
    interpolation_low_angle: bilinear
    interpolation_high_angle: bicubic
    low_angle_threshold_deg: 45

  tiling:
    size_px: 512
    overlap_px: 64
    min_tile_fraction: 0.5

# ---------------------------------------------------------------------------
# L2 — Matching (SIFT-class only for IIRS)
# Per ARCHITECTURE.md §5: SIFT-class matching against WAC reference
# ---------------------------------------------------------------------------
matchers_override:
  enabled: [sift]                    # IIRS uses SIFT-class matching
  always_run: [sift]
  disable: [rift2, lnift, lightglue, crater]  # not validated for IIRS at 80m GSD

# ---------------------------------------------------------------------------
# L4 — Geometric Verification
# GSD ratio IIRS/WAC = 80/100 = 0.8 → t_gsd = max(0.5, 0.8) = 0.8 px
# GCP min_spacing: 20 * (100/0.5) = 4000 px (WAC resolution baseline)
# ---------------------------------------------------------------------------
verification:
  f2_checks:
    enabled: mandatory
    in_domain_buffer_px: 10
    one_to_one: strict

  ransac:
    method: degensac
    max_iter: 10000
    confidence: 0.99999
    widen_on_failure: 1.5

  t_gsd:
    min_px: 0.5
    max_px: 3.0
    gsd_multiplier: 1.0

  model_ladder:
    models: [similarity, affine, homography]
    stop_on_rmse_below: 1.0

  tilewise:
    enabled: true
    trigger_latitude_deg: 55
    tile_size_px: 512
    overlap_px: 256
    min_inliers_per_tile: 12

  gcp_declustering:
    min_spacing_px: 20
    gsd_scale: true
    method: grid_nearest_center
    zscore_threshold: 3.0
    min_gcps_for_zscore: 20

# ---------------------------------------------------------------------------
# L5 — Sub-pixel Refinement
# ---------------------------------------------------------------------------
refinement:
  method: ncc
  window_px: 32
  apodization: tukey
  tukey_alpha: 0.5
  pyramid_levels: 3
  peak_fit: paraboloid
  sharpness_threshold: 0.15          # (TUNE — may need adjustment at 80m GSD)
  second_peak_rejection:
    enabled: true
    flat_window_variance_min: 10.0
    second_peak_ratio_max: 0.80
  min_refined_fraction: 0.70

# ---------------------------------------------------------------------------
# L6 — Product Generation
# ---------------------------------------------------------------------------
products:
  registered_format: GeoTIFF
  resampling: bicubic
  valid_warp_fraction_min: 0.90
  qc_checkerboard_tile_px: 64
  residual_heatmap_sigma: 3

# ---------------------------------------------------------------------------
# L7 — Evaluation (separate IIRS-WAC leaderboard rows)
# ---------------------------------------------------------------------------
evaluation:
  gt:
    grid_size: 6
    min_points_per_pair: 30
    qc_reannotate_pct: 0.20
    eval_partition: eval
  leakage:
    split_by: geo_cell
    audit_required: true
  accuracy_target:
    required_rmse_m: 80              # < 80 m absolute
    stretch_rmse_m: 40               # stretch goal
  reporting:
    separate_stratum: true           # always labeled "IIRS-WAC", never merged
